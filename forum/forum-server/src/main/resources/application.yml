server:
  port: 8080

spring:
  profiles:
    active: dev
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/forum?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf-8&zeroDateTimeBehavior=convertToNull&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: newlife24

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.forum.pojo.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto

forum:
  upload:
    path: D:/ShengYi/QA/uploads/
    url-prefix: /uploads/

knife4j:
  enable: true
  openapi:
    title: 人生Q&A API 文档
    description: 人生Q&A 论坛接口文档
    email: admin@forum.com
    version: 2.1

aliyun:
  oss:
    endpoint: ${aliyun.oss.endpoint:}
    access-key-id: ${aliyun.oss.access-key-id:}
    access-key-secret: ${aliyun.oss.access-key-secret:}
    bucket-name: ${aliyun.oss.bucket-name:}
    domain: ${aliyun.oss.domain:}
