services:
  mysql:
    image: mysql:8.0
    container_name: forum-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: forum
      MYSQL_USER: forum
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in deploy/.env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in deploy/.env}
      TZ: Asia/Shanghai
    ports:
      - '3306:3306'
    command:
      - --default-authentication-plugin=mysql_native_password
    volumes:
      - ./data/mysql:/var/lib/mysql
      - ../forum/sql/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ../forum/sql/notification.sql:/docker-entrypoint-initdb.d/02-notification.sql:ro
      - ../forum/sql/v3_post_location.sql:/docker-entrypoint-initdb.d/03-post-location.sql:ro

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.4
    container_name: forum-es
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: 'false'
      ES_JAVA_OPTS: -Xms512m -Xmx512m
      TZ: Asia/Shanghai
    ports:
      - '9200:9200'
    volumes:
      - ./data/elasticsearch:/usr/share/elasticsearch/data

  forum-server:
    image: eclipse-temurin:17-jre
    container_name: forum-server
    restart: unless-stopped
    depends_on:
      - mysql
      - elasticsearch
    working_dir: /app
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 8080
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in deploy/.env}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400000}
      CORS_ALLOWED_ORIGIN_PATTERNS: ${CORS_ALLOWED_ORIGIN_PATTERNS:?Set CORS_ALLOWED_ORIGIN_PATTERNS in deploy/.env}
      DB_URL: jdbc:mysql://mysql:3306/forum?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf-8&zeroDateTimeBehavior=convertToNull&useSSL=false&allowPublicKeyRetrieval=true
      DB_USERNAME: forum
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in deploy/.env}
      OSS_ENDPOINT: ${OSS_ENDPOINT:?Set OSS_ENDPOINT in deploy/.env}
      OSS_ACCESS_KEY_ID: ${OSS_ACCESS_KEY_ID:?Set OSS_ACCESS_KEY_ID in deploy/.env}
      OSS_ACCESS_KEY_SECRET: ${OSS_ACCESS_KEY_SECRET:?Set OSS_ACCESS_KEY_SECRET in deploy/.env}
      OSS_BUCKET_NAME: ${OSS_BUCKET_NAME:?Set OSS_BUCKET_NAME in deploy/.env}
      OSS_DOMAIN: ${OSS_DOMAIN:?Set OSS_DOMAIN in deploy/.env}
      ES_URIS: ${ES_URIS:-http://elasticsearch:9200}
      FORUM_SEARCH_ES_ENABLED: ${FORUM_SEARCH_ES_ENABLED:-true}
      KNIFE4J_ENABLE: 'false'
    ports:
      - '8080:8080'
    volumes:
      - ../forum/forum-server/target:/app
    command: ['java', '-jar', '/app/forum-server-1.0-SNAPSHOT.jar']

  forum-web:
    image: nginx:1.27-alpine
    container_name: forum-web
    restart: unless-stopped
    depends_on:
      - forum-server
    ports:
      - '80:80'
    volumes:
      - ../forum-web/dist:/usr/share/nginx/html:ro
      - ./nginx/forum.conf:/etc/nginx/conf.d/default.conf:ro
